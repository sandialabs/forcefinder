[build-system]
requires = [
    "setuptools"
]
build-backend = "setuptools.build_meta"

[project]
name = "forcefinder"
version = "0.2.0"
authors = [
    { name = "Steven Carter" },
    { email = "spcarte@sandia.gov" }
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11", 
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)", 
    "Natural Language :: English", 
    "Operating System :: Microsoft :: Windows :: Windows 10", 
    "Operating System :: Microsoft :: Windows :: Windows 11", 
    "Operating System :: MacOS :: MacOS X"
]
description = "An advanced inverse source estimation package for Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cvxpy>=1.7", 
    "joblib>=1.3.0", 
    "matplotlib>=3.5.0", 
    "numpy>=1.26.0", 
    "pyqt5", 
    "scipy>=1.10.0", 
    "sdynpy>=0.14.0"
]

[project.urls]
documentation = "https://sandialabs.github.io/forcefinder"
repository = "https://github.com/sandialabs/forcefinder"

[project.optional-dependencies]
dev = [
    "jupyter-book==1.0.4", 
    "nbconvert", 
    "pytest", 
    "pytest-cov", 
    "sdynpy>=0.18.6", 
    "sphinx-autoapi"
]
